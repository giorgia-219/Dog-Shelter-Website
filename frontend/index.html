	<script type="text/javascript">
	// Add a new sample Post for the user with id
	function addPost(userId) {
		$.ajax({
			type: "POST",
			url: "http://localhost:3333/api/posts",
			contentType: "application/json; charset=utf-8",
			dataType : "json",
			data: JSON.stringify({
				"title": "Another Post", 
				"content": "Lorem ipsum",
				"userId": userId,
			}),
			success: function(data) {
				alert("success")
			}, 
			error: function(data) {
				alert(data.status + " - " + data.statusText)
			}   
		});
	}

	// Get all users
	function getUser() {
		$.ajax({
			type: "GET",
			url: "http://localhost:3333/api/users/" + this.value,
			dataType : "json",
			success: function(data) {
				if (data != null) {
					$('#user-data').html("");
					$('#user-data').append(
						$('<div/>', {'class': 'pt-3'}).append(
							$('<h5/>',{text: data.name + " (" + data.username + ")"})
						).append(
							$('<p/>',{text: data.email})
						).append(
							$('<input/>').attr({
								type: "button",
								id: "field",
								value: "Add Post",
								onclick: "addPost(" + data.id + ")",
							})
						)
					);
				}
			},    
		});
	}

	$(document).ready(function() {
		// Get all posts
		$.ajax({
			type: "GET",
			url: "http://localhost:3333/api/posts",
			dataType : "json",
			success: function(data) {
				$.each(data, function( index, value ) {
					$("#main-col").append(
						$('<div/>', {'class': 'overflow-hidden mt-5', 'id': 'date' + index}).append(
							$('<div/>', {'class': ''}).append(
								$('<h5/>', {'class': '', text: value.title})
							).append(
								$('<p/>', {text: value.content})
							)
						)
					);
					if ('userId' in value) {
						$.ajax({
							type: "GET",
							url: "http://localhost:3333/api/users/" + value.userId,
							dataType : "json",
							success: function(data) {
								if (data != null) {
									$("#date" + index).prepend(
										$('<h6/>',{text: data.name + " (" + data.username + ")"})
									)
								}
							},
						});
					}
				});
			},
		});
		$.ajax({
			// Get all users for the
			type: "GET",
			url: "http://localhost:3333/api/users",
			dataType : "json",
			success: function(data) {
				var users = new Map();
				// add all users from userdata
				$.each(data, function( index, value ) { users.set(value.id, value.name);});
								
				$("#side-col").append(
					$("<select/>", {'class': 'form-select', 'id': 'select-user'})
				).append(
					$("<div/>", {'id': 'user-data'})
				)
				$('#select-user').on("change", getUser)
				$('#select-user').append(
					$("<option/>", {'value': '', text: 'Select a user', 'selected': 'selected'}).attr("disabled", true)
				);
				
				users.forEach((value, key) => $('#select-user').append(
					$("<option/>", {'value': key, 'text': value})
				));
			}
		});
	});
	</script>
