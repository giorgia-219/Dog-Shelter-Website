<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<title>Order ticket</title>
</head>

<body>

	<nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
			<div class="container-fluid">
				<a class="navbar-brand" href="#">Ticket service</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<li class="nav-item">
							<a class="nav-link active" aria-current="page" href="#">Home</a>
						</li>
						<li class="nav-item dropdown">
							<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
								Concerts
							</a>
							<ul class="dropdown-menu">
								<li><a class="dropdown-item" href="#">Concert 1</a></li>
								<li><a class="dropdown-item" href="#">Concert 2</a></li>
								<li><a class="dropdown-item" href="#">Concert 3</a></li>
							</ul>
						</li>
						<li class="nav-item">
							<a class="nav-link disabled" aria-disabled="true">About us</a>
						</li>
					</ul>
					<form class="d-flex" role="search">
						<input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
						<button class="btn btn-outline-success" type="submit">Search</button>
					</form>
				</div>
			</div>
		</nav>


	<div class="container mt-3">

		<div>
			
			<h2>Order ticket</h2>

			<img src="concert.png" class="d-none d-md-block img-fluid">

			<form class="mt-4 needs-validation" novalidate>
				<div class="row mb-3">
					<div class="col-12 col-md-6">
						<label for="calendar">Date of concert:</label>
						<select name="calendar" class="form-select mb-3">
							<option value="">Select a date</option>
							<option>01.04.2020</option>
							<option>02.04.2020</option>
							<option>03.04.2020</option>
							<option>04.04.2020</option>
							<option>05.04.2020</option>
							<option>06.04.2020</option>
						</select>
					</div>
					<div class="col-12 col-md-6">
						<label for="location" class="d-block">Location</label>
						<input class="form-check-input" id="bolzano" name="location" type="radio" required> <label for="bolzano" class="form-check-label me-3">Bolzano/Bozen</label> 
						<input class="form-check-input" id="merano" name="location" type="radio" required> <label for="merano" class="form-check-label me-3">Merano/Meran</label>
					</div>
				</div>

				<div class="row mb-3">
					<div class="col-12 col-md-6 mb-3">
						<label for="firstName" class="d-block">First name</label> <input type="text" id="firstName" placeholder="" value="" class="form-control" required>
						<div class="invalid-feedback">
							First name is required
						</div>
					</div>
					<div class="col-12 col-md-6 mb-3">
						<label for="lastName" class="d-block">Last name</label> <input type="text" id="lastName" placeholder="" value="" class="form-control" required>
						<div class="invalid-feedback">
							Last name is required
						</div>
					</div>
				</div>


				<div class="mb-3">
					<div>
						<label for="email" class = "d-block">Email</label> <input type="email" id="email" placeholder="youremail@example.com" class="form-control">
					</div>
				</div>

				<div class="row">
					<div class="col-12 col-md-5 mb-3">
					<label for="country" class="d-block">Country</label> <select id="country" class="form-select">
						<option value="">Select your country</option>
						<option>Deutschland</option>
						<option>France</option>
						<option>Italia</option>
						<option>United Kingdom</option>
						<option>United States</option>
					</select> </div>
					<div class="col-12 col-md-4 mb-3">
					<label for="state" class="d-block">City</label> <input id="city" placeholder="" class="form-control">
					</div>
					<div class="col-12 col-md-3 mb-3">
					<label for="zip" class="d-block">Zip</label> <input type="text" id="zip" placeholder="" class="form-control">
					</div>
				</div>

				<hr>
				<div>
					<button type="submit" class="btn btn-success px-5 me-3">Send</button>
					<button type="reset" class="btn btn-danger px-5">Reset</button>
				</div>
			</form>
		</div>

		<footer>
			<p>&copy; 2025 ACME Inc.</p>
		</footer>
	</div>

	<script src="form-validation.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
