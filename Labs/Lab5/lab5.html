<!doctype html>
<html lang="en">

<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

	<title>WIE 2025 - Lab 5</title>
</head>

<body>
	<div class="container">
		<h1 class="mt-5 mb-3">Voting</h1>
		<div id="voting"></div>
	</div>

	<script>
		var badges = [];

		function increment(i) {
 			if (!options[i].votes) {
			options[i].votes = 0;
			}

			options[i].votes++;
			badges[i].textContent = options[i].votes;
		}

		var options = [
			{ 'title': 'Option 1', 'description': 'This is Option 1' },
			{ 'title': 'Option 2', 'description': 'This is Option 2' },
			{ 'title': 'Option 3', 'description': 'This is Option 3' },
		];

		const list = document.createElement("ol");
		list.className = "list-group list-group-numbered";
		document.getElementById("voting").appendChild(list);


		for (let i = 0; i < options.length; i++) {

			const option = options[i];

			const listItem = document.createElement("li");
			listItem.className = "list-group-item d-flex justify-content-between align-items-start";

			listItem.innerHTML = `<div class="ms-2 me-auto"> <div class="fw-bold">${option.title}</div> ${option.description}</div>`;

			const badge = document.createElement("span");
			badge.className = "badge text-bg-primary rounded-pill";
			badge.textContent = "0";
			
			badges[i] = badge;

			listItem.appendChild(badge);
			list.appendChild(listItem);

			listItem.addEventListener("click", function () {
				increment(i);
			});
		}
	</script>

</body>

</html>
