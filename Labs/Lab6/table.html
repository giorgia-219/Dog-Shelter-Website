		<div id="demo">
			<!-- TODO: add 2 buttons for load data and clear table -->
			 	<button type="button" class="btn btn-primary" onclick="loadDoc()">Load Data</button>

		<script>
			function loadDoc() {
				// TODO: implement load data function

				var xhttp = new XMLHttpRequest();
				xhttp.onreadystatechange = function () {
					if (this.readyState == 4) {
						const data = xhttp.responseText	
						table = document.getElementById("table");
						if (table.childNodes.length < 6) {
							json = this.response;
							obj = JSON.parse(json);
							var tbody = document.createElement("tbody");
							tbody.setAttribute("id", "tbody")
							table.appendChild(tbody);
							var i;
							for (i = 0; i < obj.products.length; i++) {
								row = obj.products[i];
								var tr = document.createElement("tr")
								var td = document.createElement("td");
								td.textContent = row.id;
								tr.appendChild(td);
								var td = document.createElement("td");
								td.textContent = row.name;
								tr.appendChild(td);
								var td = document.createElement("td");
								td.textContent = row.hasQuantity;
								tr.appendChild(td);
								var td = document.createElement("td");
								td.textContent = row.price;
								tr.appendChild(td);
								tbody.appendChild(tr);
							}
						}
					}
				};
				xhttp.open("GET", "http://localhost:8080/products.json", true);
				xhttp.send();

			}
	
			
			function clearTable() {
				// TODO: implement clear table function
				tbody = document.getElementById("tbody")
				tbody.remove()
			}
		</script>
